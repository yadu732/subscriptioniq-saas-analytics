name: Tests and analytics smoke test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m subscriptioniq.cli generate --out data --seed 42
      - run: python -m subscriptioniq.cli build --data data --db warehouse/subscriptioniq.db --reports reports
