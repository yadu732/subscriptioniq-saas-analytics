[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "subscriptioniq"
version = "1.0.0"
description = "SaaS subscription revenue and cohort analytics portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3", "streamlit>=1.32,<2", "plotly>=5.18,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
